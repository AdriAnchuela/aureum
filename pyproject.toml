[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aureum"
version = "0.1.0"
description = "Real-time macro intelligence platform: gold, bonds, geopolitical risk and prediction markets"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adrián Anchuela" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
warehouse = ["dbt-duckdb>=1.8"]
orchestration = ["dagster>=1.7", "dagster-webserver>=1.7"]
streaming = ["confluent-kafka>=2.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "duckdb>=1.0"]

[project.scripts]
aureum = "aureum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aureum"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "LOG", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
